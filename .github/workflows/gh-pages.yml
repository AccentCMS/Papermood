# Build the demo site under demo/ with Accent CMS and publish it to GitHub
# Pages.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions".
#
# The demo's config.yaml points theme.directory at ../.., the folder that
# contains the theme checkout, so the checkout lands at themes/Papermood to
# keep that path true whatever the repository is named. --base-url carries
# the Pages URL; Accent derives the /repo base path from it and fails the
# build if any internal URL misses the prefix.
name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - "images/**"
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: themes/Papermood

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Accent CMS
        run: |
          curl -fsSL https://accentcms.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate content and templates
        working-directory: themes/Papermood/demo
        run: |
          accent validate --config config.yaml
          accent validate --config config.yaml --templates

      - name: Build demo
        working-directory: themes/Papermood/demo
        run: |
          accent build --config config.yaml --clean \
            --output "$RUNNER_TEMP/public" \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
